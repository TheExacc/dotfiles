#################################
#           Animations          #
#################################

animations = (
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.2;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.2;
      start = 1;
      end = 0.9;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "cubic-bezier(0, 0, 0.2, 1)";
      duration = 0.25;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      # This provides a slight bounce/pop effect
      curve = "cubic-bezier(0.175, 0.885, 0.32, 1.15)";
      duration = 0.3;
      start = 0.9;
      end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    # Smooth sliding for window moves and workspace switches
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.2, 0, 0.2, 1)";
      duration = 0.25;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0.2, 0, 0.2, 1)";
      duration = 0.25;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0.2, 0, 0.2, 1)";
      duration = 0.25;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.2, 0, 0.2, 1)";
      duration = 0.25;
      start = "window-y-before - window-y";
      end = 0;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
)

#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;


#################################
#           Fading              #
#################################

# Kept enabled as a fallback for windows that might not trigger the animation block
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;


#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 0.7;


#################################
#           Corners             #
#################################

corner-radius = 0;


#################################
#     Background-Blurring       #
#################################

blur-method = "dual_kawase";
blur-size = 12;
blur-strength = 7;
blur-kern = "3x3box";


#################################
#       General Settings        #
#################################

backend = "glx";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = false;
log-level = "info";


#################################
#          Window Rules         #
#################################

rules: ({
  # Tooltip windows
  match = "window_type = 'tooltip'";
  fade = true;
  shadow = true;
  opacity = 0.9;
  full-shadow = false;
}, {
  # Disable blur for dock and desktop windows
  match = "window_type = 'dock' || window_type = 'desktop' || _GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  # No rounded corners for dock/desktop
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
}, {
  # No shadow for notifications and special windows
  match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || _GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  # Shadow exclusions
  match = "class_g ?= 'glava' || class_g ?= 'conky' || class_g ?= 'Notify-osd' || class_g ?= 'polybar'";
  shadow = false;
}, {
  # Fade exclusions
  match = "class_g = 'slop'";
  fade = false;
}, {
  # Focus exclusions - always consider focused
  match = "class_g = 'Cairo-clock' || class_g = 'Bar' || class_g = 'slop'";
  focus = true;
}, {
  # Blur exclusions
  match = "class_g = 'slop' || class_g ?= 'glava' || class_g ?= 'conky'";
  blur-background = false;
}, {
  # Opacity rules for specific applications
  match = "class_g = 'Bar' || class_g = 'slop' || class_g = 'XTerm' || class_g = 'URxvt' || class_g = 'kitty' || class_g = 'Alacritty' || class_g = 'Polybar' || class_g = 'code-oss' || class_g = 'Meld' || class_g = 'Rofi' || class_g = 'TelegramDesktop' || class_g = 'conky' || class_g = 'Gedit' || class_g = 'Org.gnome.Nautilus' || class_g = 'Code' || class_g = 'jetbrains-webstorm' || class_g = 'Thunderbird'";
  opacity = 1.0;
}, {
  # Spotify with 85% opacity
  match = "class_g = 'Spotify'";
  opacity = 0.85;
}, {
  # Normal windows - no fade, shadow enabled
  match = "window_type = 'normal'";
  fade = false;
  shadow = true;
}, {
  # Popup and dropdown menus
  match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
  opacity = 0.9;
}, {
  # DND (drag and drop) windows
  match = "window_type = 'dnd'";
  shadow = true;
}, {
  # All other windows get 80% inactive opacity
  match = "window_type != 'dock' && window_type != 'desktop'";
  opacity = 0.8;
})


#################################
#      Migration Notes          #
#################################

# REMOVED DEPRECATED OPTIONS that were causing warnings:
# - inactive-opacity (use opacity in rules instead)
# - active-opacity (use opacity in rules instead)
# - inactive-opacity-override (deprecated)
# - refresh-rate (deprecated, picom auto-detects)
# - shadow-exclude (use rules instead)
# - fade-exclude (use rules instead)
# - focus-exclude (use rules instead)
# - blur-background-exclude (use rules instead)
# - opacity-rule (use rules instead)
#
# All these settings are now configured using the rules: section
#
# Note: Animations are now natively supported in the official build
# via the `animations = (...)` block included at the top of this file.